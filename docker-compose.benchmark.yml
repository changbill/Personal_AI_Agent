services:
  ollama:
    image: ollama/ollama:latest
    container_name: personal-ai-agent-ollama-benchmark
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_benchmark:/root/.ollama
    restart: "no"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  ollama_benchmark:
